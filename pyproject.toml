[project]
name = "nltest"
version = "0.1.0"
description = "Runs a test case written in plain English in a real browser and reports pass or fail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
]

[project.scripts]
nltest = "nltest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nltest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
